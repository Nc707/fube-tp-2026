# Perfil de tests de integracion: usa H2 en memoria (modo PostgreSQL), sin necesidad de levantar Postgres.
# Flyway corre las mismas migraciones V1 y V2 que en produccion.
spring:
  datasource:
    url: jdbc:h2:mem:inventario;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

# Los logs de los tests van a build/ para no mezclarse con los de la app.
logging:
  file:
    path: build/test-logs
