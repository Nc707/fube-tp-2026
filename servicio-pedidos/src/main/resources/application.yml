server:
  port: 8083

spring:
  application:
    name: servicio-pedidos
  datasource:
    url: jdbc:postgresql://localhost:5432/pedidos_db
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    job:
      enabled: false
  mvc:
    problemdetails:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      # Jaeger (docker compose up -d). Sobrescribible con OTEL_TRACES_ENDPOINT.
      endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

servicios:
  clientes:
    url: ${CLIENTES_URL:http://localhost:8081}
  inventario:
    url: ${INVENTARIO_URL:http://localhost:8082}
  http:
    connect-timeout: 2s
    read-timeout: 5s
