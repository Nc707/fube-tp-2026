# Postgres solo:            docker compose up -d
# Postgres + los 3 servicios: docker compose --profile apps up -d --build
# Los servicios dentro de Docker se hablan por nombre (servicio-pedidos, etc.).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  servicio-clientes:
    profiles: ["apps"]
    build:
      context: .
      args:
        SERVICE: servicio-clientes
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clientes_db
      PEDIDOS_BASE_URL: http://servicio-pedidos:8083
      # Para usar Statsig: CLIENTES_PROFILES=statsig y STATSIG_SERVER_KEY en el archivo .env
      SPRING_PROFILES_ACTIVE: ${CLIENTES_PROFILES:-}
      STATSIG_SERVER_KEY: ${STATSIG_SERVER_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  servicio-inventario:
    profiles: ["apps"]
    build:
      context: .
      args:
        SERVICE: servicio-inventario
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventario_db
    depends_on:
      postgres:
        condition: service_healthy

  servicio-pedidos:
    profiles: ["apps"]
    build:
      context: .
      args:
        SERVICE: servicio-pedidos
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pedidos_db
      CLIENTES_URL: http://servicio-clientes:8081
      INVENTARIO_URL: http://servicio-inventario:8082
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
